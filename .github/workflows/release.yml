name: Publish Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            artifact: release-macos-x64
          - runner: macos-15
            arch: arm64
            artifact: release-macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install native media runtime
        shell: bash
        run: brew install mpv

      - name: Configure native runtime metadata
        shell: bash
        run: |
          MPV_PREFIX="$(brew --prefix mpv)"
          LIBMPV_SOURCE="$(find "$MPV_PREFIX/lib" -maxdepth 1 \( -type f -o -type l \) -name 'libmpv.2.dylib' -print -quit)"
          if [ -z "$LIBMPV_SOURCE" ]; then
            LIBMPV_SOURCE="$(find "$MPV_PREFIX/lib" -maxdepth 1 \( -type f -o -type l \) -name 'libmpv*.dylib' -print -quit)"
          fi
          test -n "$LIBMPV_SOURCE"
          test -f "$LIBMPV_SOURCE"

          MPV_INFO="$(brew info --json=v2 mpv)"
          FFMPEG_INFO="$(brew info --json=v2 ffmpeg)"
          json_field() {
            node -e 'const value=JSON.parse(process.argv[1]).formulae[0]; const path=process.argv[2].split("."); let current=value; for (const key of path) current=current?.[key]; if (current === undefined || current === null || current === "") process.exit(2); process.stdout.write(String(current));' "$1" "$2"
          }

          echo "FONGMI_NATIVE_ARCH=${{ matrix.arch }}" >> "$GITHUB_ENV"
          echo "FONGMI_LIBMPV_SOURCE=$LIBMPV_SOURCE" >> "$GITHUB_ENV"
          echo "FONGMI_LIBMPV_VERSION=$(json_field "$MPV_INFO" versions.stable)" >> "$GITHUB_ENV"
          echo "FONGMI_LIBMPV_LICENSE=$(json_field "$MPV_INFO" license)" >> "$GITHUB_ENV"
          echo "FONGMI_LIBMPV_SOURCE_URL=$(json_field "$MPV_INFO" urls.stable.url)" >> "$GITHUB_ENV"
          echo "FONGMI_FFMPEG_VERSION=$(json_field "$FFMPEG_INFO" versions.stable)" >> "$GITHUB_ENV"
          echo "FONGMI_FFMPEG_LICENSE=$(json_field "$FFMPEG_INFO" license)" >> "$GITHUB_ENV"
          echo "FONGMI_FFMPEG_SOURCE_URL=$(json_field "$FFMPEG_INFO" urls.stable.url)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and structure tests
        run: npm test

      - name: Build native-libmpv DMG
        run: npm run package:native

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows native-libmpv packages
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Windows native audit tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$install\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $dumpbin.DirectoryName

      - name: Download pinned Windows libmpv runtime
        shell: pwsh
        run: |
          $releaseTag = "2026-08-01-1d15686142"
          $archiveName = "mpv-dev-lgpl-x86_64-20260801-git-1d15686142.7z"
          $expectedSha256 = "f82125c58012586b515e2243f6ecfae665941ff6210d592d81ede43bb7f62e65"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $extract = Join-Path $env:RUNNER_TEMP "fongmi-libmpv-$releaseTag"
          $url = "https://github.com/zhongfly/mpv-winbuild/releases/download/$releaseTag/$archiveName"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "libmpv SHA-256 mismatch: expected=$expectedSha256 actual=$actualSha256"
          }

          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          & $sevenZip x $archive "-o$extract" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed with exit code $LASTEXITCODE" }

          $library = Get-ChildItem $extract -Recurse -File | Where-Object {
            $_.Name -in @("mpv-2.dll", "libmpv-2.dll", "libmpv.dll")
          } | Select-Object -First 1
          if (-not $library) { throw "No supported libmpv DLL found in pinned archive" }

          Add-Content -Path $env:GITHUB_ENV -Value "FONGMI_NATIVE_ARCH=x64"
          Add-Content -Path $env:GITHUB_ENV -Value "FONGMI_LIBMPV_SOURCE=$($library.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "FONGMI_LIBMPV_DEPENDENCY_DIRS=$extract"
          Add-Content -Path $env:GITHUB_ENV -Value "FONGMI_LIBMPV_VERSION=git-1d15686142"
          Add-Content -Path $env:GITHUB_ENV -Value "FONGMI_LIBMPV_LICENSE=LGPL-2.1-or-later"
          Add-Content -Path $env:GITHUB_ENV -Value "FONGMI_LIBMPV_SOURCE_URL=https://github.com/mpv-player/mpv/tree/1d15686142"
          Add-Content -Path $env:GITHUB_ENV -Value "FONGMI_FFMPEG_VERSION=git-946272b79"
          Add-Content -Path $env:GITHUB_ENV -Value "FONGMI_FFMPEG_LICENSE=LGPL-2.1-or-later"
          Add-Content -Path $env:GITHUB_ENV -Value "FONGMI_FFMPEG_SOURCE_URL=https://github.com/FFmpeg/FFmpeg/tree/946272b79"

      - name: Type check
        run: npm run typecheck

      - name: Unit and structure tests
        run: npm test

      - name: Build Windows installer and portable package with native-libmpv
        run: npm run package:native

      - name: Verify bundled Windows native runtime
        env:
          REQUIRE_SIGNED: "0"
        run: npm run release:verify:native:current

      - name: Install packaged playback test dependencies
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2

      - name: Run packaged Windows native-libmpv playback test
        run: npm run e2e:native:packaged

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux native-libmpv packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install Linux native media runtime and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libmpv-dev mpv ffmpeg libavcodec-dev patchelf xvfb xauth

      - name: Configure Linux native runtime metadata
        shell: bash
        run: |
          LIBMPV_PATH="$(ldconfig -p | awk '/libmpv\.so/{print $NF; exit}')"
          if [ -z "$LIBMPV_PATH" ]; then
            LIBMPV_PATH="$(find /usr/lib /lib -name 'libmpv.so*' \( -type f -o -type l \) -print -quit 2>/dev/null)"
          fi
          test -n "$LIBMPV_PATH"
          test -e "$LIBMPV_PATH"

          MPV_VERSION="$(dpkg-query -W -f='${Version}' libmpv-dev 2>/dev/null || mpv --version | head -n1 | awk '{print $2}')"
          FFMPEG_VERSION="$(dpkg-query -W -f='${Version}' libavcodec-dev 2>/dev/null || ffmpeg -version | head -n1 | awk '{print $3}')"

          echo "FONGMI_NATIVE_ARCH=x64" >> "$GITHUB_ENV"
          echo "FONGMI_LIBMPV_SOURCE=$LIBMPV_PATH" >> "$GITHUB_ENV"
          echo "FONGMI_LIBMPV_VERSION=${MPV_VERSION:-0.37.0}" >> "$GITHUB_ENV"
          echo "FONGMI_LIBMPV_LICENSE=LGPL-2.1-or-later" >> "$GITHUB_ENV"
          echo "FONGMI_LIBMPV_SOURCE_URL=https://github.com/mpv-player/mpv" >> "$GITHUB_ENV"
          echo "FONGMI_FFMPEG_VERSION=${FFMPEG_VERSION:-6.1.1}" >> "$GITHUB_ENV"
          echo "FONGMI_FFMPEG_LICENSE=LGPL-2.1-or-later" >> "$GITHUB_ENV"
          echo "FONGMI_FFMPEG_SOURCE_URL=https://ffmpeg.org/releases" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and structure tests
        run: npm test

      - name: Build Linux AppImage and DEB with native-libmpv
        run: npm run package:native

      - name: Verify bundled Linux native runtime
        run: npm run release:verify:native:current

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs:
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: OKPlayer ${{ github.ref_name }}
          body: |
            OKPlayer 跨平台桌面版本。

            本版本重点更新：
            - 修复夸克、百度等网盘原画线路的识别、鉴权预检查与过期链接自动重取，提升原画播放成功率；
            - 改进 native-libmpv 播放器的上一集、下一集、线路回退与应用内导航体验；
            - 优化进度条拖动和键盘快进快退，合并连续跳转请求并在媒体管线卡住时自动恢复；
            - 中止尚未建立响应的过期媒体请求，同时保留已经开始传输的并行 Range 数据；
            - 修复第三方来源请求头包含中文字符时的转发异常，以及分类筛选参数跨 Electron IPC 失败的问题。

            包含以下桌面安装包：
            - macOS Intel x64 DMG（内置 native-libmpv）
            - macOS Apple Silicon arm64 DMG（内置 native-libmpv）
            - Windows x64 安装版与便携版（内置 native-libmpv）
            - Linux x64 AppImage 与 DEB（内置 native-libmpv）

            注意：当前 macOS 和 Windows 安装包尚未配置商业代码签名。首次打开时，操作系统可能显示安全确认提示。
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
