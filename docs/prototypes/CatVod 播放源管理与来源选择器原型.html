<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>播放源快速选择原型</title>
<style>
:root{
  --bg:#0a0c10;
  --panel:rgba(28,30,36,.82);
  --panel-solid:#17191f;
  --soft:rgba(255,255,255,.055);
  --hover:rgba(255,255,255,.085);
  --border:rgba(255,255,255,.095);
  --border-strong:rgba(255,255,255,.16);
  --text:#f5f5f7;
  --text2:rgba(245,245,247,.64);
  --text3:rgba(245,245,247,.42);
  --accent:#0a84ff;
  --success:#30d158;
  --warning:#ff9f0a;
  --shadow:0 18px 45px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
body{margin:0;background:#05070a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.shell{width:1440px;min-height:920px;margin:0 auto;display:grid;grid-template-columns:238px minmax(0,1fr);overflow:hidden;background:radial-gradient(circle at 72% -20%,rgba(76,108,210,.14),transparent 36%),linear-gradient(180deg,#101218 0%,#090b0f 100%);box-shadow:0 25px 80px rgba(0,0,0,.48)}
.sidebar{position:relative;padding:48px 14px 18px;border-right:1px solid var(--border);background:rgba(22,24,30,.72);backdrop-filter:blur(28px) saturate(140%)}
.brand{display:flex;align-items:center;gap:11px;margin:0 12px 34px}.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#0a84ff,#735bf2);font-size:14px}.brand strong{display:block;font-size:17px}.brand span{display:block;margin-top:3px;color:var(--text3);font-size:10px}.nav-title{margin:24px 12px 8px;color:var(--text3);font-size:10px;letter-spacing:.13em}.nav button{width:100%;height:44px;margin:2px 0;padding:0 13px;border:0;border-radius:11px;background:transparent;color:var(--text2);text-align:left;font-size:13px}.nav button b{display:inline-block;width:25px;color:var(--text3)}.nav button.active{background:rgba(10,132,255,.16);color:#fff}.nav button.active b{color:#69b2ff}.sidebar-foot{position:absolute;left:28px;right:28px;bottom:26px;color:var(--text3);font-size:10px;line-height:1.8}.sidebar-foot i{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--success)}
.workspace{position:relative;min-width:0}.topbar{height:82px;padding:0 34px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(14,16,21,.72);backdrop-filter:blur(24px)}.topbar small{display:block;color:var(--text3);font-size:10px}.topbar strong{display:block;margin-top:3px;font-size:18px}.source-trigger{margin-left:auto;height:40px;min-width:210px;padding:0 13px;display:flex;align-items:center;gap:9px;border:1px solid var(--border-strong);border-radius:11px;background:var(--soft);color:var(--text2);text-align:left}.source-trigger:hover{background:var(--hover)}.source-trigger i{width:7px;height:7px;border-radius:50%;background:var(--success)}.source-trigger b{color:var(--text);font-size:12px}.source-trigger span:last-child{margin-left:auto;color:var(--text3)}
.content{padding:34px 38px 50px}.title-row{display:flex;align-items:flex-start}.title-row h1{margin:0;font-size:30px;letter-spacing:-.025em}.title-row p{margin:9px 0 0;color:var(--text2);font-size:13px}.setting-link{margin-left:auto;height:36px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:var(--soft);color:var(--text2);font-size:11px}.setting-link:hover{background:var(--hover)}
.search-box{position:relative;margin-top:24px}.search-box span{position:absolute;left:15px;top:12px;color:var(--text3)}.search-box input{width:100%;height:44px;padding:0 16px 0 42px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.045);outline:none;font-size:13px}.search-box input:focus{border-color:rgba(10,132,255,.7);box-shadow:0 0 0 3px rgba(10,132,255,.16)}
.tabs{display:flex;gap:7px;margin-top:16px}.tabs button{height:32px;padding:0 14px;border:1px solid var(--border);border-radius:9px;background:var(--soft);color:var(--text2);font-size:11px}.tabs button.active{border-color:rgba(10,132,255,.48);background:rgba(10,132,255,.22);color:#fff}
.section{margin-top:29px}.section-head{display:flex;align-items:flex-end;margin-bottom:13px}.section-head h2{margin:0;font-size:16px}.section-head span{margin-left:9px;color:var(--text3);font-size:10px}.section-head em{margin-left:auto;color:var(--text3);font-size:10px;font-style:normal}.source-grid,.recent-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.source-card{position:relative;min-height:106px;padding:17px;border:1px solid var(--border);border-radius:14px;background:rgba(28,30,36,.68);text-align:left;transition:.16s ease;box-shadow:0 10px 24px rgba(0,0,0,.12)}.source-card:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.18);background:rgba(37,40,48,.82);box-shadow:var(--shadow)}.source-card.selected{border-color:rgba(10,132,255,.72);background:linear-gradient(145deg,rgba(19,38,63,.94),rgba(23,27,34,.88));box-shadow:0 0 0 2px rgba(10,132,255,.10)}.source-card .icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.07);color:#9bb2ca;font-size:11px;font-weight:750}.source-card[data-group="4K"] .icon{background:rgba(10,132,255,.16);color:#70b8ff}.source-card[data-group="秒播"] .icon{background:rgba(255,159,10,.14);color:#ffb449}.source-card[data-group="采集"] .icon{background:rgba(48,209,88,.13);color:#62dd80}.source-card strong{display:block;margin-top:12px;font-size:13px}.source-card small{display:block;margin-top:5px;color:var(--text3);font-size:10px}.source-card .check{position:absolute;right:13px;top:13px;display:none;width:22px;height:22px;border-radius:50%;place-items:center;background:var(--accent);color:#fff;font-size:12px}.source-card.selected .check{display:grid}.source-card .status{position:absolute;right:14px;bottom:15px;color:#74e391;font-size:10px}.source-card .status:before{content:"";display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:var(--success)}
.footer-note{margin-top:25px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.035);color:var(--text3);font-size:10px}.footer-note b{color:var(--text2)}
.picker-mask{position:absolute;inset:82px 0 0;background:rgba(0,0,0,.26);display:none;z-index:8}.picker-mask.open{display:block}.picker{position:absolute;right:32px;top:92px;width:410px;height:690px;padding:18px;border:1px solid var(--border-strong);border-radius:18px;background:rgba(20,22,28,.96);backdrop-filter:blur(30px) saturate(150%);box-shadow:0 32px 90px rgba(0,0,0,.58);display:none;z-index:10}.picker.open{display:block}.picker-head{display:flex;align-items:center}.picker-head h3{margin:0;font-size:17px}.picker-head button{margin-left:auto;width:31px;height:31px;border:1px solid var(--border);border-radius:9px;background:var(--soft);color:var(--text2)}.picker-search{position:relative;margin-top:15px}.picker-search span{position:absolute;left:13px;top:11px;color:var(--text3)}.picker-search input{width:100%;height:39px;padding:0 12px 0 37px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.045);outline:none;font-size:11px}.picker-tabs{display:flex;gap:6px;margin-top:12px;overflow:auto}.picker-tabs button{flex:0 0 auto;height:29px;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:var(--soft);color:var(--text2);font-size:9px}.picker-tabs button.active{background:rgba(10,132,255,.22);border-color:rgba(10,132,255,.45);color:#fff}.picker-list{margin-top:11px;height:545px;overflow:auto;padding-right:3px}.picker-group-title{margin:14px 4px 7px;color:var(--text3);font-size:9px;letter-spacing:.08em}.picker-item{width:100%;height:54px;padding:0 9px;display:grid;grid-template-columns:34px 1fr auto;align-items:center;border:0;border-radius:11px;background:transparent;text-align:left}.picker-item:hover,.picker-item.selected{background:rgba(255,255,255,.07)}.picker-item .icon{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:rgba(10,132,255,.14);color:#70b8ff;font-size:10px}.picker-item strong{display:block;font-size:11px}.picker-item small{display:block;margin-top:3px;color:var(--text3);font-size:9px}.picker-item em{font-style:normal;color:#78df93;font-size:9px}.picker-footer{position:absolute;left:18px;right:18px;bottom:14px;padding-top:11px;border-top:1px solid var(--border);color:var(--text3);font-size:9px}
@media(max-width:1100px){.shell{width:100%;grid-template-columns:210px 1fr}.source-grid,.recent-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="logo">▶</div><div><strong>FongMi</strong><span>macOS Edition</span></div></div>
    <div class="nav"><button><b>⌂</b>首页</button><button><b>▣</b>片库</button><button><b>⌕</b>搜索</button></div>
    <div class="nav-title">我的</div><div class="nav"><button><b>♡</b>收藏</button><button><b>◷</b>历史</button></div>
    <div class="nav-title">管理</div><div class="nav"><button class="active"><b>▤</b>播放源</button><button><b>⚙</b>设置</button></div>
    <div class="sidebar-foot"><div><i></i>当前播放服务正常</div><div>技术配置已移至“设置”</div></div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div><small>QUICK SOURCE</small><strong>播放源</strong></div>
      <button class="source-trigger" onclick="togglePicker()"><i></i><span>当前：</span><b id="currentName">玩偶｜4K</b><span>⌄</span></button>
    </header>

    <main class="content">
      <div class="title-row"><div><h1>选择播放源</h1><p>点击后立即切换，只展示当前可用的影视来源。</p></div><button class="setting-link">播放源设置</button></div>
      <label class="search-box"><span>⌕</span><input id="pageSearch" placeholder="搜索播放源，例如：玩偶、4K、韩剧" oninput="filterCards()" /></label>
      <div class="tabs" id="pageTabs"><button class="active" data-filter="全部" onclick="selectPageTab(this)">全部</button><button data-filter="4K" onclick="selectPageTab(this)">4K</button><button data-filter="秒播" onclick="selectPageTab(this)">秒播</button><button data-filter="采集" onclick="selectPageTab(this)">采集</button></div>

      <section class="section"><div class="section-head"><h2>最近使用</h2><span>优先展示常用来源</span></div><div class="recent-grid">
        <button class="source-card selected" data-name="玩偶｜4K" data-group="4K" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">4K</span><strong>玩偶｜4K</strong><small>高质量影视资源</small><span class="status">可用</span></button>
        <button class="source-card" data-name="天堂｜采集" data-group="采集" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">采</span><strong>天堂｜采集</strong><small>搜索与播放已验证</small><span class="status">可用</span></button>
        <button class="source-card" data-name="韩剧｜秒播" data-group="秒播" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">秒</span><strong>韩剧｜秒播</strong><small>韩剧内容来源</small><span class="status">可用</span></button>
        <button class="source-card" data-name="至臻｜4K" data-group="4K" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">4K</span><strong>至臻｜4K</strong><small>4K 影视资源</small><span class="status">可用</span></button>
      </div></section>

      <section class="section"><div class="section-head"><h2>全部播放源</h2><span>异常、直播和工具类来源已自动隐藏</span><em id="count">12 个可用</em></div><div class="source-grid" id="sourceGrid">
        <button class="source-card selected" data-name="玩偶｜4K" data-group="4K" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">4K</span><strong>玩偶｜4K</strong><small>高质量影视资源</small><span class="status">可用</span></button>
        <button class="source-card" data-name="至臻｜4K" data-group="4K" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">4K</span><strong>至臻｜4K</strong><small>4K 影视资源</small><span class="status">可用</span></button>
        <button class="source-card" data-name="观影｜4K" data-group="4K" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">4K</span><strong>观影｜4K</strong><small>电影与剧集</small><span class="status">可用</span></button>
        <button class="source-card" data-name="指南｜4K" data-group="4K" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">4K</span><strong>指南｜4K</strong><small>综合影视资源</small><span class="status">可用</span></button>
        <button class="source-card" data-name="韩剧｜秒播" data-group="秒播" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">秒</span><strong>韩剧｜秒播</strong><small>韩剧内容来源</small><span class="status">可用</span></button>
        <button class="source-card" data-name="瓜子｜秒播" data-group="秒播" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">秒</span><strong>瓜子｜秒播</strong><small>电影与电视剧</small><span class="status">可用</span></button>
        <button class="source-card" data-name="大师兄｜秒播" data-group="秒播" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">秒</span><strong>大师兄｜秒播</strong><small>综合影视内容</small><span class="status">可用</span></button>
        <button class="source-card" data-name="热播｜秒播" data-group="秒播" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">秒</span><strong>热播｜秒播</strong><small>热门电影剧集</small><span class="status">可用</span></button>
        <button class="source-card" data-name="天堂｜采集" data-group="采集" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">采</span><strong>天堂｜采集</strong><small>搜索与播放已验证</small><span class="status">可用</span></button>
        <button class="source-card" data-name="爱天堂｜采集" data-group="采集" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">采</span><strong>爱天堂｜采集</strong><small>综合影视采集</small><span class="status">可用</span></button>
        <button class="source-card" data-name="影库｜采集" data-group="采集" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">采</span><strong>影库｜采集</strong><small>电影与剧集资源</small><span class="status">可用</span></button>
        <button class="source-card" data-name="波波｜采集" data-group="采集" onclick="chooseSource(this.dataset.name)"><span class="check">✓</span><span class="icon">采</span><strong>波波｜采集</strong><small>综合影视来源</small><span class="status">可用</span></button>
      </div></section>

      <div class="footer-note"><b>页面只负责选择。</b> 服务启停、版本更新、配置导入、日志和异常检测统一放在“设置”中。</div>
    </main>

    <div id="pickerMask" class="picker-mask" onclick="togglePicker(false)"></div>
    <aside id="picker" class="picker">
      <div class="picker-head"><h3>选择播放源</h3><button onclick="togglePicker(false)">×</button></div>
      <label class="picker-search"><span>⌕</span><input id="pickerSearch" placeholder="搜索来源，例如：玩偶、4K、韩剧" oninput="filterPicker()" /></label>
      <div class="picker-tabs" id="pickerTabs"><button class="active" data-filter="全部" onclick="selectPickerTab(this)">全部</button><button data-filter="最近" onclick="selectPickerTab(this)">最近使用</button><button data-filter="4K" onclick="selectPickerTab(this)">4K</button><button data-filter="秒播" onclick="selectPickerTab(this)">秒播</button><button data-filter="采集" onclick="selectPickerTab(this)">采集</button></div>
      <div class="picker-list" id="pickerList">
        <div class="picker-group-title">最近使用</div>
        <button class="picker-item selected" data-name="玩偶｜4K" data-group="4K" data-recent="1" onclick="chooseSource(this.dataset.name)"><span class="icon">4K</span><div><strong>玩偶｜4K</strong><small>高质量影视资源</small></div><em>当前</em></button>
        <button class="picker-item" data-name="天堂｜采集" data-group="采集" data-recent="1" onclick="chooseSource(this.dataset.name)"><span class="icon">采</span><div><strong>天堂｜采集</strong><small>搜索与播放已验证</small></div><em>可用</em></button>
        <button class="picker-item" data-name="韩剧｜秒播" data-group="秒播" data-recent="1" onclick="chooseSource(this.dataset.name)"><span class="icon">秒</span><div><strong>韩剧｜秒播</strong><small>韩剧内容来源</small></div><em>可用</em></button>
        <div class="picker-group-title">更多来源</div>
        <button class="picker-item" data-name="至臻｜4K" data-group="4K" onclick="chooseSource(this.dataset.name)"><span class="icon">4K</span><div><strong>至臻｜4K</strong><small>4K 影视资源</small></div><em>可用</em></button>
        <button class="picker-item" data-name="观影｜4K" data-group="4K" onclick="chooseSource(this.dataset.name)"><span class="icon">4K</span><div><strong>观影｜4K</strong><small>电影与剧集</small></div><em>可用</em></button>
        <button class="picker-item" data-name="瓜子｜秒播" data-group="秒播" onclick="chooseSource(this.dataset.name)"><span class="icon">秒</span><div><strong>瓜子｜秒播</strong><small>电影与电视剧</small></div><em>可用</em></button>
        <button class="picker-item" data-name="爱天堂｜采集" data-group="采集" onclick="chooseSource(this.dataset.name)"><span class="icon">采</span><div><strong>爱天堂｜采集</strong><small>综合影视采集</small></div><em>可用</em></button>
      </div>
      <div class="picker-footer">仅展示可用影视来源；直播、工具和异常来源默认隐藏。</div>
    </aside>
  </div>
</div>
<script>
let pageFilter='全部';let pickerFilter='全部';
function togglePicker(force){const picker=document.getElementById('picker');const mask=document.getElementById('pickerMask');const open=typeof force==='boolean'?force:!picker.classList.contains('open');picker.classList.toggle('open',open);mask.classList.toggle('open',open)}
function chooseSource(name){document.getElementById('currentName').textContent=name;document.querySelectorAll('.source-card,.picker-item').forEach(item=>item.classList.toggle('selected',item.dataset.name===name));document.querySelectorAll('.picker-item em').forEach(item=>item.textContent='可用');const selected=[...document.querySelectorAll('.picker-item')].find(item=>item.dataset.name===name);if(selected)selected.querySelector('em').textContent='当前';togglePicker(false)}
function selectPageTab(button){document.querySelectorAll('#pageTabs button').forEach(item=>item.classList.remove('active'));button.classList.add('active');pageFilter=button.dataset.filter;filterCards()}
function filterCards(){const keyword=document.getElementById('pageSearch').value.trim().toLowerCase();let visible=0;document.querySelectorAll('#sourceGrid .source-card').forEach(card=>{const show=(!keyword||card.dataset.name.toLowerCase().includes(keyword)||card.dataset.group.toLowerCase().includes(keyword))&&(pageFilter==='全部'||card.dataset.group===pageFilter);card.style.display=show?'block':'none';if(show)visible++});document.getElementById('count').textContent=`${visible} 个可用`}
function selectPickerTab(button){document.querySelectorAll('#pickerTabs button').forEach(item=>item.classList.remove('active'));button.classList.add('active');pickerFilter=button.dataset.filter;filterPicker()}
function filterPicker(){const keyword=document.getElementById('pickerSearch').value.trim().toLowerCase();document.querySelectorAll('.picker-item').forEach(item=>{const recent=pickerFilter==='最近'&&item.dataset.recent==='1';const group=pickerFilter==='全部'||pickerFilter==='最近'?pickerFilter==='全部'||recent:item.dataset.group===pickerFilter;const text=item.dataset.name.toLowerCase()+item.dataset.group.toLowerCase();item.style.display=group&&(!keyword||text.includes(keyword))?'grid':'none'});document.querySelectorAll('.picker-group-title').forEach(title=>title.style.display=pickerFilter==='全部'&&!keyword?'block':'none')}
</script>
</body>
</html>
