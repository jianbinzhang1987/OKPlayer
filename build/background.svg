  <path d="M355 382H709" stroke="url(#arrow)" stroke-width="8" stroke-linecap="round"/>
  <path d="M682 350L718 382L682 414" fill="none" stroke="#71809B" stroke-opacity="0.72" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

