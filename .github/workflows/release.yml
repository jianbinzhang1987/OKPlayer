name: Publish Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            artifact: release-macos-x64
          - runner: macos-15
            arch: arm64
            artifact: release-macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install native media runtime
        shell: bash
        run: brew install mpv

      - name: Configure native runtime metadata
        shell: bash
        run: |
          MPV_PREFIX="$(brew --prefix mpv)"
          LIBMPV_SOURCE="$(find "$MPV_PREFIX/lib" -maxdepth 1 \( -type f -o -type l \) -name 'libmpv.2.dylib' -print -quit)"
          if [ -z "$LIBMPV_SOURCE" ]; then
            LIBMPV_SOURCE="$(find "$MPV_PREFIX/lib" -maxdepth 1 \( -type f -o -type l \) -name 'libmpv*.dylib' -print -quit)"
          fi
          test -n "$LIBMPV_SOURCE"
          test -f "$LIBMPV_SOURCE"

          MPV_INFO="$(brew info --json=v2 mpv)"
          FFMPEG_INFO="$(brew info --json=v2 ffmpeg)"
          json_field() {
            node -e 'const value=JSON.parse(process.argv[1]).formulae[0]; const path=process.argv[2].split("."); let current=value; for (const key of path) current=current?.[key]; if (current === undefined || current === null || current === "") process.exit(2); process.stdout.write(String(current));' "$1" "$2"
          }

          echo "FONGMI_NATIVE_ARCH=${{ matrix.arch }}" >> "$GITHUB_ENV"
          echo "FONGMI_LIBMPV_SOURCE=$LIBMPV_SOURCE" >> "$GITHUB_ENV"
          echo "FONGMI_LIBMPV_VERSION=$(json_field "$MPV_INFO" versions.stable)" >> "$GITHUB_ENV"
          echo "FONGMI_LIBMPV_LICENSE=$(json_field "$MPV_INFO" license)" >> "$GITHUB_ENV"
          echo "FONGMI_LIBMPV_SOURCE_URL=$(json_field "$MPV_INFO" urls.stable.url)" >> "$GITHUB_ENV"
          echo "FONGMI_FFMPEG_VERSION=$(json_field "$FFMPEG_INFO" versions.stable)" >> "$GITHUB_ENV"
          echo "FONGMI_FFMPEG_LICENSE=$(json_field "$FFMPEG_INFO" license)" >> "$GITHUB_ENV"
          echo "FONGMI_FFMPEG_SOURCE_URL=$(json_field "$FFMPEG_INFO" urls.stable.url)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and structure tests
        run: npm test

      - name: Build native-libmpv DMG
        run: npm run package:native

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows packages
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and structure tests
        run: npm test

      - name: Build Windows installer and portable package
        run: npm run package:win

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and structure tests
        run: npm test

      - name: Build Linux AppImage and DEB
        run: npm run package:linux

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs:
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: OKPlayer ${{ github.ref_name }}
          body: |
            OKPlayer 跨平台桌面版本。

            本版本重点更新：
            - macOS Intel 与 Apple Silicon 安装包内置 native-libmpv 高兼容播放运行时，标准播放和兼容播放均保持在应用内；
            - 修复移动端 User-Agent 含逗号时导致 libmpv 请求头被错误拆分、媒体返回 HTTP 400 的问题；
            - 修正来源质量误报，自动抽样只用于推荐和排序，Android Dex/JAR 来源按平台能力忽略；
            - 区分 Android 运行时和网盘业务能力，支持通过桌面 CatVod Node 登录并浏览夸克、百度等网盘；
            - 修复浅色主题可读性、来源切换后首页不刷新以及图片加载失败等体验问题；
            - 外部播放器入口和自动兜底已关闭，播放失败时改为应用内换线路、换来源或重试。

            包含以下桌面安装包：
            - macOS Intel x64 DMG（内置 native-libmpv）
            - macOS Apple Silicon arm64 DMG（内置 native-libmpv）
            - Windows x64 安装版与便携版
            - Linux x64 AppImage 与 DEB

            注意：当前 macOS 和 Windows 安装包尚未配置商业代码签名。首次打开时，操作系统可能显示安全确认提示。
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
