      <stop stop-color="#FBFCFF"/>
      <stop offset="0.55" stop-color="#F3F6FB"/>
      <stop offset="1" stop-color="#E9EEF7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(820 70) rotate(132) scale(520 460)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A8EFF" stop-opacity="0.22"/>
