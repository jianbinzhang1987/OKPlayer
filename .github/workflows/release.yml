name: Publish Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and structure tests
        run: npm test

      - name: Build macOS x64 and arm64 DMG
        run: npm run package:mac:all

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows packages
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and structure tests
        run: npm test

      - name: Build Windows installer and portable package
        run: npm run package:win

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and structure tests
        run: npm test

      - name: Build Linux AppImage and DEB
        run: npm run package:linux

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs:
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: OKPlayer ${{ github.ref_name }}
          body: |
            OKPlayer 跨平台桌面版本。

            本版本重点修复浅色主题可读性、Windows CatVod 服务启动和设置持久化问题，并优化搜索与播放源界面。

            包含以下桌面安装包：
            - macOS Intel x64 DMG
            - macOS Apple Silicon arm64 DMG
            - Windows x64 安装版与便携版
            - Linux x64 AppImage 与 DEB

            注意：当前 macOS 和 Windows 安装包尚未配置商业代码签名。首次打开时，操作系统可能显示安全确认提示。
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
